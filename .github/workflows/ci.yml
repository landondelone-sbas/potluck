name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engine, dish library, app)
        run: npm test

      - name: Format
        run: npm run format:check

      # Jest cannot catch a package Metro fails to resolve. Bundling both platforms can.
      - name: Bundle check (Metro, iOS and Android)
        run: npm run bundle:check -w @potluck/mobile
